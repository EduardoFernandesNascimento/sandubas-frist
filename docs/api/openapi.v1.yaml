openapi: 3.0.3
info:
  title: Sanduba's Frist API
  version: v1
  description: Contrato da F-001 (login, cadastro e cardápio público). Trabalho acadêmico, dados fictícios.
  license:
    name: Uso acadêmico
servers:
  - url: http://localhost:3000
    description: API local de demonstração
security: []
tags:
  - name: auth
    description: Login e cadastro
  - name: produtos
    description: Cardápio
paths:
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Entrar com e-mail e senha
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginEntrada'
      responses:
        '200':
          description: Credenciais corretas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResposta'
        '400':
          $ref: '#/components/responses/Erro400'
        '401':
          $ref: '#/components/responses/Erro401'
  /auth/cadastro:
    post:
      tags: [auth]
      operationId: cadastro
      summary: Criar conta de cliente
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CadastroEntrada'
      responses:
        '201':
          description: Usuário criado com perfil cliente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/Erro400'
        '409':
          $ref: '#/components/responses/Erro409'
  /produtos:
    get:
      tags: [produtos]
      operationId: listarProdutos
      summary: Listar produtos (público)
      security: []
      responses:
        '200':
          description: Lista de produtos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Produto'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Erro400:
      description: Dados inválidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    Erro401:
      description: Credenciais ou token inválidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    Erro403:
      description: Perfil sem permissão
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    Erro409:
      description: E-mail já cadastrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
  schemas:
    Perfil:
      type: string
      enum: [cliente, loja, entregador]
    Usuario:
      type: object
      additionalProperties: false
      required: [id, nome, email, perfil]
      properties:
        id: { type: integer }
        nome: { type: string }
        email: { type: string, format: email }
        perfil: { $ref: '#/components/schemas/Perfil' }
    Produto:
      type: object
      additionalProperties: false
      required: [id, nome, categoria, preco, ativo]
      properties:
        id: { type: integer }
        nome: { type: string }
        categoria: { type: string }
        preco: { type: number }
        ativo: { type: boolean }
    LoginEntrada:
      type: object
      additionalProperties: false
      required: [email, senha]
      properties:
        email: { type: string, format: email }
        senha: { type: string, minLength: 1 }
    CadastroEntrada:
      type: object
      additionalProperties: false
      required: [nome, email, senha]
      properties:
        nome: { type: string, minLength: 1 }
        email: { type: string, format: email }
        senha: { type: string, minLength: 6 }
    LoginResposta:
      type: object
      additionalProperties: false
      required: [token, usuario]
      properties:
        token: { type: string }
        usuario: { $ref: '#/components/schemas/Usuario' }
    Erro:
      type: object
      additionalProperties: false
      required: [mensagem]
      properties:
        mensagem: { type: string }
