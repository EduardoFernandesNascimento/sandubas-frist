openapi: 3.0.3
info:
  title: First Sanduba's API
  version: 3.0.0
  description: Contrato da F-001 (login, cadastro e cardápio), da F-002 (loja, bairros, endereços, pedido do cliente e pagamento simulado) e da F-003 (painel da loja, cadastro de produtos e bairros, atribuição e entregas do entregador). Trabalho acadêmico, dados fictícios.
  license:
    name: Uso acadêmico
servers:
  - url: http://localhost:3000
    description: API local de demonstração
security: []
tags:
  - name: auth
    description: Login e cadastro
  - name: produtos
    description: Cardápio e cadastro de produtos
  - name: loja
    description: Situação da loja e bairros atendidos
  - name: enderecos
    description: Endereços do cliente
  - name: pedidos
    description: Pedidos do cliente e painel da loja
  - name: entregadores
    description: Entregadores e disponibilidade
  - name: entregas
    description: Entregas atribuídas ao entregador
paths:
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Entrar com e-mail e senha
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginEntrada'
      responses:
        '200':
          description: Credenciais corretas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResposta'
        '400':
          $ref: '#/components/responses/Erro400'
        '401':
          $ref: '#/components/responses/Erro401'
  /auth/cadastro:
    post:
      tags: [auth]
      operationId: cadastro
      summary: Criar conta de cliente
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CadastroEntrada'
      responses:
        '201':
          description: Usuário criado com perfil cliente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/Erro400'
        '409':
          $ref: '#/components/responses/Erro409'
  /produtos:
    get:
      tags: [produtos]
      operationId: listarProdutos
      summary: Listar produtos do cardápio (público só os ativos; loja com todos=1 inclui os inativos)
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: todos
          in: query
          required: false
          description: 'Com 1, devolve também os inativos; exige token de perfil loja'
          schema:
            type: integer
            enum: [1]
      responses:
        '200':
          description: Lista de produtos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Produto'
        '401':
          $ref: '#/components/responses/Erro401'
        '403':
          $ref: '#/components/responses/Erro403'
    post:
      tags: [produtos]
      operationId: criarProduto
      summary: Cadastrar produto (loja)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProdutoEntrada'
      responses:
        '201':
          description: Produto criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Produto'
        '400':
          $ref: '#/components/responses/Erro400'
        '401':
          $ref: '#/components/responses/Erro401'
        '403':
          $ref: '#/components/responses/Erro403'
  /produtos/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [produtos]
      operationId: editarProduto
      summary: Editar produto (loja)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProdutoEntrada'
      responses:
        '200':
          description: Produto atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Produto'
        '400':
          $ref: '#/components/responses/Erro400'
        '401':
          $ref: '#/components/responses/Erro401'
        '403':
          $ref: '#/components/responses/Erro403'
        '404':
          $ref: '#/components/responses/Erro404'
    patch:
      tags: [produtos]
      operationId: pausarProduto
      summary: Ativar ou pausar produto sem excluir (loja)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProdutoAtivoEntrada'
      responses:
        '200':
          description: Produto atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Produto'
        '400':
          $ref: '#/components/responses/Erro400'
        '401':
          $ref: '#/components/responses/Erro401'
        '403':
          $ref: '#/components/responses/Erro403'
        '404':
          $ref: '#/components/responses/Erro404'
  /loja:
    get:
      tags: [loja]
      operationId: obterLoja
      summary: Situação da loja, pedido mínimo e tempos (público)
      security: []
      responses:
        '200':
          description: Dados da loja
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Loja'
  /bairros:
    get:
      tags: [loja]
      operationId: listarBairros
      summary: Bairros atendidos e taxa de entrega (público)
      security: []
      responses:
        '200':
          description: Lista de bairros
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Bairro'
    post:
      tags: [loja]
      operationId: criarBairro
      summary: Cadastrar bairro e taxa de entrega (loja)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BairroEntrada'
      responses:
        '201':
          description: Bairro criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bairro'
        '400':
          $ref: '#/components/responses/Erro400'
        '401':
          $ref: '#/components/responses/Erro401'
        '403':
          $ref: '#/components/responses/Erro403'
  /bairros/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [loja]
      operationId: editarBairro
      summary: Editar bairro e taxa de entrega (loja)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BairroEntrada'
      responses:
        '200':
          description: Bairro atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bairro'
        '400':
          $ref: '#/components/responses/Erro400'
        '401':
          $ref: '#/components/responses/Erro401'
        '403':
          $ref: '#/components/responses/Erro403'
        '404':
          $ref: '#/components/responses/Erro404'
  /enderecos:
    get:
      tags: [enderecos]
      operationId: listarEnderecos
      summary: Endereços do cliente logado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de endereços do cliente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Endereco'
        '401':
          $ref: '#/components/responses/Erro401'
        '403':
          $ref: '#/components/responses/Erro403'
    post:
      tags: [enderecos]
      operationId: criarEndereco
      summary: Cadastrar endereço do cliente logado (bairro da lista)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnderecoEntrada'
      responses:
        '201':
          description: Endereço criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Endereco'
        '400':
          $ref: '#/components/responses/Erro400'
        '401':
          $ref: '#/components/responses/Erro401'
        '403':
          $ref: '#/components/responses/Erro403'
  /pedidos:
    get:
      tags: [pedidos]
      operationId: listarPedidos
      summary: Todos os pedidos (loja), com os recebidos primeiro (RN07)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de pedidos, status recebido no topo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pedido'
        '401':
          $ref: '#/components/responses/Erro401'
        '403':
          $ref: '#/components/responses/Erro403'
    post:
      tags: [pedidos]
      operationId: criarPedido
      summary: Criar pedido (total e preços calculados pela API)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedidoEntrada'
      responses:
        '201':
          description: Pedido criado com status aguardando_pagamento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
        '400':
          $ref: '#/components/responses/Erro400'
        '401':
          $ref: '#/components/responses/Erro401'
        '403':
          $ref: '#/components/responses/Erro403'
  /pedidos/meus:
    get:
      tags: [pedidos]
      operationId: listarMeusPedidos
      summary: Pedidos do cliente logado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de pedidos do cliente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pedido'
        '401':
          $ref: '#/components/responses/Erro401'
        '403':
          $ref: '#/components/responses/Erro403'
  /pedidos/{id}/pagamento:
    post:
      tags: [pedidos]
      operationId: simularPagamento
      summary: Simular pagamento (aprovado vira recebido, recusado vira cancelado)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PagamentoEntrada'
      responses:
        '200':
          description: Pedido com o status atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
        '400':
          $ref: '#/components/responses/Erro400'
        '401':
          $ref: '#/components/responses/Erro401'
        '403':
          $ref: '#/components/responses/Erro403'
        '404':
          $ref: '#/components/responses/Erro404'
  /pedidos/{id}/status:
    patch:
      tags: [pedidos]
      operationId: atualizarStatusPedido
      summary: 'Mudar o status (loja: em_preparo, pronto, cancelado com motivo; entregador: saiu_para_entrega, entregue)'
      description: 'Transição fora do ciclo aguardando_pagamento → recebido → em_preparo → pronto → saiu_para_entrega → entregue, ou recusa sem motivo, gera 400. Cancelamento da loja depois do aceite com pagamento aprovado grava estornoRegistrado (RN06). Cada mudança entra em historico (RN12).'
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusEntrada'
      responses:
        '200':
          description: Pedido com o status atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
        '400':
          $ref: '#/components/responses/Erro400'
        '401':
          $ref: '#/components/responses/Erro401'
        '403':
          $ref: '#/components/responses/Erro403'
        '404':
          $ref: '#/components/responses/Erro404'
  /pedidos/{id}/entregador:
    patch:
      tags: [pedidos]
      operationId: atribuirEntregador
      summary: Atribuir o pedido a um entregador disponível (loja)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtribuicaoEntrada'
      responses:
        '200':
          description: Pedido com o entregador atribuído
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
        '400':
          $ref: '#/components/responses/Erro400'
        '401':
          $ref: '#/components/responses/Erro401'
        '403':
          $ref: '#/components/responses/Erro403'
        '404':
          $ref: '#/components/responses/Erro404'
  /entregadores:
    get:
      tags: [entregadores]
      operationId: listarEntregadores
      summary: Entregadores e disponibilidade (loja)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de entregadores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Entregador'
        '401':
          $ref: '#/components/responses/Erro401'
        '403':
          $ref: '#/components/responses/Erro403'
  /entregadores/me:
    patch:
      tags: [entregadores]
      operationId: alterarDisponibilidade
      summary: Entregador logado marca-se disponível ou indisponível
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisponibilidadeEntrada'
      responses:
        '200':
          description: Entregador atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entregador'
        '400':
          $ref: '#/components/responses/Erro400'
        '401':
          $ref: '#/components/responses/Erro401'
        '403':
          $ref: '#/components/responses/Erro403'
  /entregas:
    get:
      tags: [entregas]
      operationId: listarEntregas
      summary: Entregas atribuídas ao entregador logado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista das entregas do entregador, com endereço completo e contato do cliente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Entrega'
        '401':
          $ref: '#/components/responses/Erro401'
        '403':
          $ref: '#/components/responses/Erro403'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
  responses:
    Erro400:
      description: Dados inválidos ou regra de negócio violada
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    Erro401:
      description: Credenciais ou token inválidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    Erro403:
      description: Perfil sem permissão
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    Erro404:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    Erro409:
      description: E-mail já cadastrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
  schemas:
    Perfil:
      type: string
      enum: [cliente, loja, entregador]
    StatusPedido:
      type: string
      enum: [aguardando_pagamento, recebido, em_preparo, pronto, saiu_para_entrega, entregue, cancelado]
    FormaPagamento:
      type: string
      enum: [pix, cartao, dinheiro]
    Usuario:
      type: object
      additionalProperties: false
      required: [id, nome, email, perfil]
      properties:
        id: { type: integer }
        nome: { type: string }
        email: { type: string, format: email }
        perfil: { $ref: '#/components/schemas/Perfil' }
        telefone: { type: string, description: 'Telefone fictício' }
    Entregador:
      type: object
      additionalProperties: false
      required: [id, nome, disponivel]
      properties:
        id: { type: integer }
        nome: { type: string }
        telefone: { type: string }
        disponivel: { type: boolean }
    DisponibilidadeEntrada:
      type: object
      additionalProperties: false
      required: [disponivel]
      properties:
        disponivel: { type: boolean }
    Adicional:
      type: object
      additionalProperties: false
      required: [nome, preco]
      properties:
        nome: { type: string }
        preco: { type: number }
    Produto:
      type: object
      additionalProperties: false
      required: [id, nome, categoria, preco, ativo, descricao, foto, ingredientes, adicionais]
      properties:
        id: { type: integer }
        nome: { type: string }
        categoria: { type: string }
        preco: { type: number }
        ativo: { type: boolean }
        descricao: { type: string }
        foto: { type: string, description: 'URL local ou emoji usado como placeholder' }
        ingredientes:
          type: array
          items: { type: string }
        adicionais:
          type: array
          items: { $ref: '#/components/schemas/Adicional' }
    ProdutoEntrada:
      type: object
      additionalProperties: false
      required: [nome, categoria, preco]
      properties:
        nome: { type: string, minLength: 1 }
        categoria: { type: string, minLength: 1 }
        preco: { type: number, exclusiveMinimum: true, minimum: 0 }
        ativo: { type: boolean, description: 'Padrão true na criação' }
        descricao: { type: string }
        foto: { type: string }
        ingredientes:
          type: array
          items: { type: string }
        adicionais:
          type: array
          items: { $ref: '#/components/schemas/Adicional' }
    ProdutoAtivoEntrada:
      type: object
      additionalProperties: false
      required: [ativo]
      properties:
        ativo: { type: boolean }
    Loja:
      type: object
      additionalProperties: false
      required: [aberta, pedidoMinimo, tempoPreparoMin, tempoEntregaMin]
      properties:
        aberta: { type: boolean }
        pedidoMinimo: { type: number }
        tempoPreparoMin: { type: integer }
        tempoEntregaMin: { type: integer }
    Bairro:
      type: object
      additionalProperties: false
      required: [id, nome, taxa]
      properties:
        id: { type: integer }
        nome: { type: string }
        taxa: { type: number }
    BairroEntrada:
      type: object
      additionalProperties: false
      required: [nome, taxa]
      properties:
        nome: { type: string, minLength: 1 }
        taxa: { type: number, minimum: 0 }
    Endereco:
      type: object
      additionalProperties: false
      required: [id, clienteId, rua, numero, bairroId]
      properties:
        id: { type: integer }
        clienteId: { type: integer }
        rua: { type: string }
        numero: { type: string }
        complemento: { type: string }
        bairroId: { type: integer }
    EnderecoEntrada:
      type: object
      additionalProperties: false
      required: [rua, numero, bairroId]
      properties:
        rua: { type: string, minLength: 1 }
        numero: { type: string, minLength: 1 }
        complemento: { type: string }
        bairroId: { type: integer }
    ItemPedidoEntrada:
      type: object
      additionalProperties: false
      required: [produtoId, quantidade]
      properties:
        produtoId: { type: integer }
        quantidade: { type: integer, minimum: 1 }
        adicionais:
          type: array
          description: Nomes dos adicionais do produto
          items: { type: string }
        removidos:
          type: array
          description: Ingredientes removidos
          items: { type: string }
        observacao: { type: string }
    PedidoEntrada:
      type: object
      additionalProperties: false
      required: [itens, enderecoId, formaPagamento]
      properties:
        itens:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ItemPedidoEntrada' }
        enderecoId: { type: integer }
        formaPagamento: { $ref: '#/components/schemas/FormaPagamento' }
        trocoPara: { type: number, description: 'Só quando formaPagamento = dinheiro' }
    ItemPedido:
      type: object
      additionalProperties: false
      required: [produtoId, nome, quantidade, precoUnitario]
      properties:
        produtoId: { type: integer }
        nome: { type: string, description: 'Nome do produto copiado no momento do pedido (AUD-001)' }
        quantidade: { type: integer }
        precoUnitario: { type: number, description: 'Preço do produto copiado no momento do pedido' }
        adicionais:
          type: array
          description: Adicionais com o preço copiado no momento do pedido
          items: { $ref: '#/components/schemas/Adicional' }
        removidos:
          type: array
          items: { type: string }
        observacao: { type: string }
    HistoricoStatus:
      type: object
      additionalProperties: false
      required: [status, em]
      properties:
        status: { $ref: '#/components/schemas/StatusPedido' }
        em: { type: string, format: date-time }
    Pedido:
      type: object
      additionalProperties: false
      required: [id, clienteId, itens, taxaEntrega, total, formaPagamento, status, criadoEm, historico]
      properties:
        id: { type: integer }
        clienteId: { type: integer }
        entregadorId: { type: integer }
        enderecoId: { type: integer }
        itens:
          type: array
          items: { $ref: '#/components/schemas/ItemPedido' }
        taxaEntrega: { type: number }
        total: { type: number }
        formaPagamento: { $ref: '#/components/schemas/FormaPagamento' }
        trocoPara: { type: number }
        status: { $ref: '#/components/schemas/StatusPedido' }
        criadoEm: { type: string, format: date-time }
        historico:
          type: array
          description: Cada mudança de status com data e hora (RN12)
          items: { $ref: '#/components/schemas/HistoricoStatus' }
        motivo: { type: string, description: 'Motivo da recusa ou do cancelamento pela loja' }
        estornoRegistrado: { type: boolean, description: 'true quando a loja cancelou depois do aceite com pagamento aprovado (RN06)' }
    StatusEntrada:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/StatusPedido' }
        motivo: { type: string, minLength: 1, description: 'Obrigatório quando status = cancelado' }
    AtribuicaoEntrada:
      type: object
      additionalProperties: false
      required: [entregadorId]
      properties:
        entregadorId: { type: integer }
    Entrega:
      type: object
      additionalProperties: false
      required: [pedido, endereco, bairro, clienteNome]
      properties:
        pedido: { $ref: '#/components/schemas/Pedido' }
        endereco: { $ref: '#/components/schemas/Endereco' }
        bairro: { $ref: '#/components/schemas/Bairro' }
        clienteNome: { type: string }
        clienteTelefone: { type: string }
    PagamentoEntrada:
      type: object
      additionalProperties: false
      required: [aprovado]
      properties:
